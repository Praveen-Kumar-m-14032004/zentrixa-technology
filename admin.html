<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zentrixa Admin | Reviews & Inquiries</title>

    <!-- React -->
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://resource.trickle.so/vendor_lib/unpkg/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Icons -->
    <link
        href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css"
        rel="stylesheet"
    >

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style type="text/tailwindcss">

        @layer theme {
            :root {
                --primary: #00f0ff;
                --secondary: #7000ff;
                --bg-dark: #050507;
                --text-main: #ffffff;
            }
        }

        @layer base {
            body {
                font-family: 'Plus Jakarta Sans', sans-serif;
                background-color: var(--bg-dark);
                color: var(--text-main);
            }
        }

        * {
            box-sizing: border-box;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #050507;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

    </style>

    <!-- ============================================================
         API BRIDGE
         Works both locally and on Azure App Service.
         ============================================================ -->
    <script>

        /*
         * IMPORTANT:
         *
         * Local:
         * http://localhost:3000
         *
         * Azure:
         * https://your-app.azurewebsites.net
         *
         * window.location.origin automatically detects the
         * current environment.
         */

        const API_BASE = window.location.origin;


        // ------------------------------------------------------------
        // CREATE
        // ------------------------------------------------------------

        async function trickleCreateObject(type, data) {

            const res = await fetch(
                `${API_BASE}/api/objects/${type}`,
                {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                }
            );

            if (!res.ok) {

                const err = await res
                    .json()
                    .catch(() => ({}));

                throw new Error(
                    err.message ||
                    `Failed to create ${type}`
                );
            }

            return res.json();
        }


        // ------------------------------------------------------------
        // LIST
        // ------------------------------------------------------------

        async function trickleListObjects(
            type,
            limit = 100,
            desc = true
        ) {

            const res = await fetch(
                `${API_BASE}/api/objects/${type}?limit=${limit}&desc=${desc}`
            );

            if (!res.ok) {

                const err = await res
                    .json()
                    .catch(() => ({}));

                throw new Error(
                    err.message ||
                    `Failed to fetch ${type}`
                );
            }

            return res.json();
        }


        // ------------------------------------------------------------
        // UPDATE
        // ------------------------------------------------------------

        async function trickleUpdateObject(
            type,
            id,
            data
        ) {

            const res = await fetch(
                `${API_BASE}/api/objects/${type}/${id}`,
                {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                }
            );

            if (!res.ok) {

                const err = await res
                    .json()
                    .catch(() => ({}));

                throw new Error(
                    err.message ||
                    `Failed to update ${type}/${id}`
                );
            }

            return res.json();
        }


        // ------------------------------------------------------------
        // DELETE
        // ------------------------------------------------------------

        async function trickleDeleteObject(
            type,
            id
        ) {

            const res = await fetch(
                `${API_BASE}/api/objects/${type}/${id}`,
                {
                    method: 'DELETE'
                }
            );

            if (!res.ok) {

                const err = await res
                    .json()
                    .catch(() => ({}));

                throw new Error(
                    err.message ||
                    `Failed to delete ${type}/${id}`
                );
            }

            return res.json();
        }

    </script>

</head>


<body>

    <div id="root"></div>


    <script type="text/babel">

        function AdminApp() {

            // ========================================================
            // STATE
            // ========================================================

            const [reviews, setReviews] = React.useState([]);

            const [inquiries, setInquiries] = React.useState([]);

            const [loading, setLoading] = React.useState(true);

            const [filter, setFilter] = React.useState('All');

            const [activeTab, setActiveTab] = React.useState('reviews');

            const [errorMsg, setErrorMsg] = React.useState(null);

            const [toast, setToast] = React.useState(null);

            const prevReviewCountRef =
                React.useRef(null);

            const prevInquiryCountRef =
                React.useRef(null);


            // ========================================================
            // SHOW TOAST
            // ========================================================

            const showToast = React.useCallback(
                (message, type = 'success') => {

                    setToast({
                        message,
                        type
                    });

                    setTimeout(() => {
                        setToast(null);
                    }, 4000);

                },
                []
            );


            // ========================================================
            // FETCH REVIEWS
            // ========================================================

            const fetchReviews = React.useCallback(
                async (silent = false) => {

                    if (!silent) {
                        setLoading(true);
                    }

                    setErrorMsg(null);

                    try {

                        const response =
                            await trickleListObjects(
                                'client_review',
                                100,
                                true
                            );

                        if (
                            response &&
                            response.items
                        ) {

                            const newCount =
                                response.items.length;


                            // New review notification
                            if (
                                prevReviewCountRef.current !== null &&
                                newCount >
                                prevReviewCountRef.current
                            ) {

                                const newest =
                                    response.items[0];

                                showToast(
                                    `New review from ${newest.objectData.Name || 'client'}!`
                                );
                            }


                            prevReviewCountRef.current =
                                newCount;

                            setReviews(
                                response.items
                            );
                        }

                    } catch (error) {

                        console.error(
                            'Failed to fetch reviews:',
                            error
                        );

                        setErrorMsg(
                            'Failed to load reviews.'
                        );

                    } finally {

                        if (!silent) {
                            setLoading(false);
                        }

                    }

                },
                [showToast]
            );


            // ========================================================
            // FETCH INQUIRIES
            // ========================================================

            const fetchInquiries = React.useCallback(
                async () => {

                    try {

                        const response =
                            await trickleListObjects(
                                'inquiry',
                                100,
                                true
                            );


                        if (
                            response &&
                            response.items
                        ) {

                            const newCount =
                                response.items.length;


                            // New inquiry notification
                            if (
                                prevInquiryCountRef.current !== null &&
                                newCount >
                                prevInquiryCountRef.current
                            ) {

                                const newest =
                                    response.items[0];

                                showToast(
                                    `New inquiry from ${newest.objectData.Name || 'customer'}!`
                                );
                            }


                            prevInquiryCountRef.current =
                                newCount;

                            setInquiries(
                                response.items
                            );
                        }

                    } catch (error) {

                        console.error(
                            'Failed to fetch inquiries:',
                            error
                        );

                        setErrorMsg(
                            'Failed to load inquiries.'
                        );

                    }

                },
                [showToast]
            );


            // ========================================================
            // INITIAL LOAD
            // ========================================================

            React.useEffect(() => {

                fetchReviews();

                fetchInquiries();

            }, [
                fetchReviews,
                fetchInquiries
            ]);


            // ========================================================
            // AUTO REFRESH
            // Every 10 seconds
            // ========================================================

            React.useEffect(() => {

                const id = setInterval(() => {

                    fetchReviews(true);

                    fetchInquiries();

                }, 10000);


                return () => {
                    clearInterval(id);
                };

            }, [
                fetchReviews,
                fetchInquiries
            ]);


            // ========================================================
            // REVIEW VISIBILITY
            // ========================================================

            const toggleVisibility =
                async (review) => {

                    const newStatus =
                        !review.objectData.IsHidden;


                    // Optimistic UI update
                    setReviews(prev =>
                        prev.map(r =>
                            r.objectId === review.objectId
                                ? {
                                    ...r,
                                    objectData: {
                                        ...r.objectData,
                                        IsHidden: newStatus
                                    }
                                }
                                : r
                        )
                    );


                    try {

                        await trickleUpdateObject(
                            'client_review',
                            review.objectId,
                            {
                                ...review.objectData,
                                IsHidden: newStatus
                            }
                        );


                        showToast(
                            newStatus
                                ? 'Review hidden successfully.'
                                : 'Review is now visible.'
                        );

                    } catch (error) {

                        console.error(error);

                        setErrorMsg(
                            'Failed to update review visibility.'
                        );

                        fetchReviews();

                    }

                };


            // ========================================================
            // DELETE REVIEW
            // ========================================================

            const handleDeleteReview =
                async (id) => {

                    if (
                        !confirm(
                            'Are you sure you want to delete this review?'
                        )
                    ) {
                        return;
                    }


                    try {

                        await trickleDeleteObject(
                            'client_review',
                            id
                        );


                        setReviews(prev =>
                            prev.filter(
                                r =>
                                    r.objectId !== id
                            )
                        );


                        showToast(
                            'Review deleted successfully.'
                        );

                    } catch (error) {

                        console.error(error);

                        setErrorMsg(
                            'Failed to delete review.'
                        );

                    }

                };


            // ========================================================
            // DELETE INQUIRY
            // ========================================================

            const handleDeleteInquiry =
                async (id) => {

                    if (
                        !confirm(
                            'Are you sure you want to delete this inquiry?'
                        )
                    ) {
                        return;
                    }


                    try {

                        await trickleDeleteObject(
                            'inquiry',
                            id
                        );


                        setInquiries(prev =>
                            prev.filter(
                                item =>
                                    item.objectId !== id
                            )
                        );


                        showToast(
                            'Inquiry deleted successfully.'
                        );

                    } catch (error) {

                        console.error(error);

                        setErrorMsg(
                            'Failed to delete inquiry.'
                        );

                    }

                };


            // ========================================================
            // FILTER REVIEWS
            // ========================================================

            const filteredReviews =
                reviews.filter(review => {

                    if (
                        filter === 'Visible'
                    ) {
                        return !review.objectData.IsHidden;
                    }

                    if (
                        filter === 'Hidden'
                    ) {
                        return review.objectData.IsHidden;
                    }

                    return true;

                });


            // ========================================================
            // RENDER
            // ========================================================

            return (

                <div className="min-h-screen bg-[#050507] text-white p-4 md:p-8">


                    {/* ==================================================
                        TOAST
                        ================================================== */}

                    {toast && (

                        <div
                            className={`fixed top-4 right-4 z-50 flex items-center gap-3 text-sm font-semibold px-5 py-3 rounded-xl shadow-lg backdrop-blur-md animate-pulse ${
                                toast.type === 'success'
                                    ? 'bg-green-500/20 border border-green-500/40 text-green-300'
                                    : 'bg-red-500/20 border border-red-500/40 text-red-300'
                            }`}
                        >

                            <div
                                className={
                                    toast.type === 'success'
                                        ? 'icon-check-circle w-4 h-4'
                                        : 'icon-circle-alert w-4 h-4'
                                }
                            ></div>

                            {toast.message}

                        </div>

                    )}


                    <div className="max-w-6xl mx-auto">


                        {/* ==================================================
                            HEADER
                            ================================================== */}

                        <div className="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 border-b border-white/10 pb-6">

                            <div>

                                <div className="flex items-center gap-3 mb-1">

                                    <h1 className="text-3xl font-bold font-['Outfit']">
                                        Zentrixa Admin
                                    </h1>


                                    <span className="flex items-center gap-1.5 text-xs text-green-400 bg-green-500/10 border border-green-500/20 px-2 py-1 rounded-full">

                                        <span className="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse inline-block"></span>

                                        Live

                                    </span>

                                </div>


                                <p className="text-gray-400 text-sm">

                                    Manage client reviews and customer inquiries
                                    &nbsp;·&nbsp;

                                    <span className="text-cyan-400 font-semibold">
                                        {window.location.origin}/admin.html
                                    </span>

                                </p>

                            </div>


                            <div className="flex gap-3">

                                <a
                                    href="/index.html"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="px-4 py-2 rounded-lg bg-white/5 border border-white/10 hover:bg-white/10 transition-colors text-sm flex items-center gap-2"
                                >

                                    <div className="icon-external-link w-4 h-4"></div>

                                    View Live Site

                                </a>


                                <button
                                    onClick={() => {

                                        fetchReviews();

                                        fetchInquiries();

                                    }}
                                    className="px-4 py-2 rounded-lg bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 hover:bg-cyan-500/20 transition-colors text-sm flex items-center gap-2"
                                >

                                    <div className="icon-refresh-cw w-4 h-4"></div>

                                    Refresh

                                </button>

                            </div>

                        </div>


                        {/* ==================================================
                            MAIN TABS
                            ================================================== */}

                        <div className="flex gap-3 mb-6">

                            <button
                                onClick={() =>
                                    setActiveTab('reviews')
                                }
                                className={`px-5 py-2.5 rounded-lg text-sm font-bold transition-all ${
                                    activeTab === 'reviews'
                                        ? 'bg-cyan-500 text-black'
                                        : 'bg-white/5 text-gray-400 hover:text-white border border-white/10'
                                }`}
                            >

                                Reviews ({reviews.length})

                            </button>


                            <button
                                onClick={() =>
                                    setActiveTab('inquiries')
                                }
                                className={`px-5 py-2.5 rounded-lg text-sm font-bold transition-all ${
                                    activeTab === 'inquiries'
                                        ? 'bg-cyan-500 text-black'
                                        : 'bg-white/5 text-gray-400 hover:text-white border border-white/10'
                                }`}
                            >

                                Inquiries ({inquiries.length})

                            </button>

                        </div>


                        {/* ==================================================
                            ERROR
                            ================================================== */}

                        {errorMsg && (

                            <div className="mb-6 p-5 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 text-sm">

                                <div className="flex items-center gap-2 font-bold mb-1">

                                    <div className="icon-circle-alert"></div>

                                    Connection Error

                                </div>


                                <p className="text-gray-300">
                                    {errorMsg}
                                </p>


                                <p className="mt-2 text-xs text-gray-500">

                                    Make sure
                                    <span className="text-white font-mono ml-1">
                                        npm start
                                    </span>
                                    is running and MongoDB is connected.

                                </p>

                            </div>

                        )}


                        {/* ==================================================
                            REVIEWS TAB
                            ================================================== */}

                        {activeTab === 'reviews' && (

                            <>

                                {/* ------------------------------------------
                                    REVIEW STATS
                                    ------------------------------------------ */}

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">

                                    <div className="bg-cyan-500/5 border border-cyan-500/20 rounded-xl p-4 text-center">

                                        <div className="text-2xl font-bold text-cyan-400">
                                            {reviews.length}
                                        </div>

                                        <div className="text-xs text-gray-400 mt-1">
                                            Total Reviews
                                        </div>

                                    </div>


                                    <div className="bg-green-500/5 border border-green-500/20 rounded-xl p-4 text-center">

                                        <div className="text-2xl font-bold text-green-400">
                                            {
                                                reviews.filter(
                                                    r =>
                                                        !r.objectData.IsHidden
                                                ).length
                                            }
                                        </div>

                                        <div className="text-xs text-gray-400 mt-1">
                                            Visible
                                        </div>

                                    </div>


                                    <div className="bg-red-500/5 border border-red-500/20 rounded-xl p-4 text-center">

                                        <div className="text-2xl font-bold text-red-400">
                                            {
                                                reviews.filter(
                                                    r =>
                                                        r.objectData.IsHidden
                                                ).length
                                            }
                                        </div>

                                        <div className="text-xs text-gray-400 mt-1">
                                            Hidden
                                        </div>

                                    </div>

                                </div>


                                {/* ------------------------------------------
                                    REVIEW FILTERS
                                    ------------------------------------------ */}

                                <div className="flex gap-2 mb-6">

                                    {[
                                        'All',
                                        'Visible',
                                        'Hidden'
                                    ].map(f => (

                                        <button
                                            key={f}
                                            onClick={() =>
                                                setFilter(f)
                                            }
                                            className={`px-4 py-1.5 rounded-full text-sm font-bold transition-all ${
                                                filter === f
                                                    ? 'bg-white text-black'
                                                    : 'bg-white/5 text-gray-400 hover:text-white'
                                            }`}
                                        >

                                            {f}

                                            <span className="opacity-50 ml-1 text-xs">

                                                (
                                                {
                                                    reviews.filter(
                                                        r => {

                                                            if (
                                                                f === 'Visible'
                                                            ) {
                                                                return !r.objectData.IsHidden;
                                                            }

                                                            if (
                                                                f === 'Hidden'
                                                            ) {
                                                                return r.objectData.IsHidden;
                                                            }

                                                            return true;

                                                        }
                                                    ).length
                                                }
                                                )

                                            </span>

                                        </button>

                                    ))}

                                </div>


                                {/* ------------------------------------------
                                    REVIEW LIST
                                    ------------------------------------------ */}

                                {loading ? (

                                    <div className="flex justify-center py-20">

                                        <div className="w-8 h-8 border-2 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>

                                    </div>

                                ) : filteredReviews.length === 0 ? (

                                    <div className="text-center py-20 bg-white/5 rounded-xl border border-dashed border-white/10">

                                        <div className="icon-inbox text-4xl text-gray-600 mb-3 mx-auto"></div>

                                        <p className="text-gray-500 font-semibold">
                                            No reviews yet.
                                        </p>

                                        <p className="text-gray-600 text-sm mt-1">
                                            When someone submits a review on the live site, it will appear here automatically.
                                        </p>

                                    </div>

                                ) : (

                                    <div className="grid gap-4">

                                        {filteredReviews.map(review => {

                                            const data =
                                                review.objectData;

                                            const isHidden =
                                                data.IsHidden;


                                            return (

                                                <div
                                                    key={review.objectId}
                                                    className={`p-6 rounded-xl border transition-all duration-300 flex flex-col md:flex-row gap-6 ${
                                                        isHidden
                                                            ? 'bg-red-500/5 border-red-500/20 opacity-70'
                                                            : 'bg-[#0f0f16] border-white/10 hover:border-cyan-500/30'
                                                    }`}
                                                >

                                                    <div className="flex-grow">

                                                        <div className="flex items-start justify-between mb-2">

                                                            <div className="flex items-center gap-3">

                                                                <div
                                                                    className={`w-9 h-9 rounded-full flex items-center justify-center font-bold text-black text-sm shrink-0 ${
                                                                        data.Category === 'Workshop'
                                                                            ? 'bg-purple-400'
                                                                            : 'bg-cyan-400'
                                                                    }`}
                                                                >
                                                                    {
                                                                        data.Name
                                                                            ?.charAt(0)
                                                                            ?.toUpperCase() ||
                                                                        '?'
                                                                    }
                                                                </div>


                                                                <div>

                                                                    <h3 className="font-bold text-white flex flex-wrap items-center gap-2">

                                                                        {data.Name}

                                                                        <span
                                                                            className={`text-[10px] px-2 py-0.5 rounded border ${
                                                                                data.Category === 'Workshop'
                                                                                    ? 'border-purple-500/30 text-purple-400 bg-purple-500/10'
                                                                                    : 'border-cyan-500/30 text-cyan-400 bg-cyan-500/10'
                                                                            }`}
                                                                        >
                                                                            {
                                                                                data.Category ||
                                                                                'Project'
                                                                            }
                                                                        </span>


                                                                        {isHidden && (

                                                                            <span className="text-[10px] px-2 py-0.5 rounded border border-red-500/30 text-red-400 bg-red-500/10">
                                                                                Hidden
                                                                            </span>

                                                                        )}

                                                                    </h3>


                                                                    <p className="text-xs text-gray-500">
                                                                        {data.Role}
                                                                    </p>

                                                                </div>

                                                            </div>


                                                            {/* Stars */}

                                                            <div className="flex gap-1 shrink-0">

                                                                {
                                                                    [...Array(5)].map(
                                                                        (_, i) => (

                                                                            <div
                                                                                key={i}
                                                                                className={`icon-star w-3 h-3 ${
                                                                                    i < data.Rating
                                                                                        ? 'text-yellow-400'
                                                                                        : 'text-gray-700'
                                                                                }`}
                                                                            ></div>

                                                                        )
                                                                    )
                                                                }

                                                            </div>

                                                        </div>


                                                        <p className="text-gray-300 text-sm mt-3 bg-black/20 p-3 rounded-lg border border-white/5 italic">

                                                            "{data.Content}"

                                                        </p>


                                                        <div className="mt-2 flex items-center gap-4 text-xs text-gray-600">

                                                            <span>

                                                                {
                                                                    new Date(
                                                                        data.Date ||
                                                                        review.createdAt
                                                                    ).toLocaleDateString(
                                                                        'en-IN',
                                                                        {
                                                                            day: '2-digit',
                                                                            month: 'short',
                                                                            year: 'numeric'
                                                                        }
                                                                    )
                                                                }

                                                            </span>


                                                            <span className="font-mono text-gray-700">

                                                                ID:
                                                                {' '}
                                                                {
                                                                    String(
                                                                        review.objectId
                                                                    ).slice(-8)
                                                                }

                                                            </span>

                                                        </div>

                                                    </div>


                                                    {/* Review actions */}

                                                    <div className="flex md:flex-col gap-2 shrink-0 justify-center md:border-l border-white/10 md:pl-6">

                                                        <button
                                                            onClick={() =>
                                                                toggleVisibility(
                                                                    review
                                                                )
                                                            }
                                                            className={`flex items-center gap-2 px-4 py-2 rounded-lg font-bold text-xs transition-colors w-full justify-center ${
                                                                isHidden
                                                                    ? 'bg-green-500/10 text-green-400 border border-green-500/20 hover:bg-green-500/20'
                                                                    : 'bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/20'
                                                            }`}
                                                        >

                                                            <div
                                                                className={`${
                                                                    isHidden
                                                                        ? 'icon-eye'
                                                                        : 'icon-eye-off'
                                                                } w-4 h-4`}
                                                            ></div>

                                                            {
                                                                isHidden
                                                                    ? 'Show'
                                                                    : 'Hide'
                                                            }

                                                        </button>


                                                        <button
                                                            onClick={() =>
                                                                handleDeleteReview(
                                                                    review.objectId
                                                                )
                                                            }
                                                            className="flex items-center gap-2 px-4 py-2 rounded-lg bg-white/5 text-gray-400 border border-white/5 hover:bg-red-500/20 hover:text-red-400 hover:border-red-500/20 transition-colors text-xs w-full justify-center"
                                                        >

                                                            <div className="icon-trash-2 w-4 h-4"></div>

                                                            Delete

                                                        </button>

                                                    </div>

                                                </div>

                                            );

                                        })}

                                    </div>

                                )}

                            </>

                        )}


                        {/* ==================================================
                            INQUIRIES TAB
                            ================================================== */}

                        {activeTab === 'inquiries' && (

                            <div>


                                {/* ------------------------------------------
                                    INQUIRY HEADER
                                    ------------------------------------------ */}

                                <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 mb-6">

                                    <div>

                                        <h2 className="text-xl font-bold font-['Outfit']">
                                            Customer Inquiries
                                        </h2>

                                        <p className="text-sm text-gray-500 mt-1">
                                            Enquiries received from the website
                                        </p>

                                    </div>


                                    <div className="px-4 py-2 rounded-lg bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 text-sm font-bold">

                                        {inquiries.length}
                                        {' '}
                                        Total

                                    </div>

                                </div>


                                {/* ------------------------------------------
                                    NO INQUIRIES
                                    ------------------------------------------ */}

                                {inquiries.length === 0 ? (

                                    <div className="text-center py-20 bg-white/5 rounded-xl border border-dashed border-white/10">

                                        <div className="icon-inbox text-4xl text-gray-600 mb-3 mx-auto"></div>

                                        <p className="text-gray-500 font-semibold">
                                            No inquiries yet.
                                        </p>

                                        <p className="text-gray-600 text-sm mt-1">
                                            New website enquiries will appear here automatically.
                                        </p>

                                    </div>

                                ) : (

                                    /* --------------------------------------
                                       INQUIRY LIST
                                       -------------------------------------- */

                                    <div className="grid gap-4">

                                        {inquiries.map(inquiry => {

                                            const data =
                                                inquiry.objectData;


                                            /*
                                             * Different projects sometimes
                                             * use different names for phone.
                                             * This checks several possibilities.
                                             */

                                            const phone =
                                                data.Phone ||
                                                data.phone ||
                                                data.Mobile ||
                                                data.mobile ||
                                                '';


                                            /*
                                             * WhatsApp message
                                             */

                                            const whatsappMessage =
                                                `Hi ${data.Name || ''},

Thank you for contacting Zentrixa Technologies.

Service: ${data.Service || ''}
Category: ${data.Category || ''}

Your message:
${data.Message || ''}`;


                                            /*
                                             * If a phone number exists,
                                             * use it.
                                             *
                                             * Otherwise open WhatsApp
                                             * without a specific recipient.
                                             */

                                            const cleanPhone =
                                                String(phone)
                                                    .replace(/\D/g, '');


                                            const whatsappUrl =
                                                cleanPhone
                                                    ? `https://wa.me/${cleanPhone}?text=${encodeURIComponent(whatsappMessage)}`
                                                    : `https://wa.me/?text=${encodeURIComponent(whatsappMessage)}`;


                                            return (

                                                <div
                                                    key={inquiry.objectId}
                                                    className="p-6 rounded-xl border border-white/10 bg-[#0f0f16] hover:border-cyan-500/30 transition-all"
                                                >

                                                    <div className="flex flex-col md:flex-row justify-between gap-6">


                                                        {/* ======================
                                                            INQUIRY DETAILS
                                                            ====================== */}

                                                        <div className="flex-grow">


                                                            {/* Customer */}

                                                            <div className="flex items-center gap-3 mb-5">

                                                                <div className="w-10 h-10 rounded-full bg-cyan-400 flex items-center justify-center font-bold text-black">

                                                                    {
                                                                        data.Name
                                                                            ?.charAt(0)
                                                                            ?.toUpperCase() ||
                                                                        '?'
                                                                    }

                                                                </div>


                                                                <div>

                                                                    <h3 className="font-bold text-white text-lg">

                                                                        {
                                                                            data.Name ||
                                                                            'Unknown'
                                                                        }

                                                                    </h3>


                                                                    <p className="text-sm text-gray-500">

                                                                        {
                                                                            data.Email ||
                                                                            'No email provided'
                                                                        }

                                                                    </p>

                                                                </div>

                                                            </div>


                                                            {/* Information */}

                                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5">


                                                                <div>

                                                                    <p className="text-xs text-gray-500 mb-1">
                                                                        Service
                                                                    </p>

                                                                    <p className="text-sm text-white font-medium">
                                                                        {
                                                                            data.Service ||
                                                                            '-'
                                                                        }
                                                                    </p>

                                                                </div>


                                                                <div>

                                                                    <p className="text-xs text-gray-500 mb-1">
                                                                        Category
                                                                    </p>

                                                                    <p className="text-sm text-white font-medium">
                                                                        {
                                                                            data.Category ||
                                                                            '-'
                                                                        }
                                                                    </p>

                                                                </div>


                                                                <div>

                                                                    <p className="text-xs text-gray-500 mb-1">
                                                                        Phone
                                                                    </p>

                                                                    <p className="text-sm text-white font-medium">
                                                                        {
                                                                            phone ||
                                                                            '-'
                                                                        }
                                                                    </p>

                                                                </div>

                                                            </div>


                                                            {/* Message */}

                                                            <div className="mb-5">

                                                                <p className="text-xs text-gray-500 mb-1">
                                                                    Message
                                                                </p>


                                                                <p className="text-sm text-gray-300 bg-black/20 p-4 rounded-lg border border-white/5 whitespace-pre-wrap">

                                                                    {
                                                                        data.Message ||
                                                                        'No message provided'
                                                                    }

                                                                </p>

                                                            </div>


                                                            {/* Date / ID */}

                                                            <div className="flex flex-wrap gap-4 text-xs text-gray-600">

                                                                <span>

                                                                    {
                                                                        new Date(
                                                                            data.Date ||
                                                                            inquiry.createdAt
                                                                        ).toLocaleString(
                                                                            'en-IN'
                                                                        )
                                                                    }

                                                                </span>


                                                                <span className="font-mono">

                                                                    ID:
                                                                    {' '}
                                                                    {
                                                                        String(
                                                                            inquiry.objectId
                                                                        ).slice(-8)
                                                                    }

                                                                </span>

                                                            </div>

                                                        </div>


                                                        {/* ======================
                                                            INQUIRY ACTIONS
                                                            ====================== */}

                                                        <div className="flex md:flex-col gap-2 justify-center md:border-l border-white/10 md:pl-6">


                                                            {/* WhatsApp */}

                                                            <a
                                                                href={whatsappUrl}
                                                                target="_blank"
                                                                rel="noopener noreferrer"
                                                                className="flex items-center justify-center gap-2 px-4 py-2 rounded-lg bg-green-500/10 text-green-400 border border-green-500/20 hover:bg-green-500/20 text-xs font-bold"
                                                            >

                                                                <div className="icon-message-circle w-4 h-4"></div>

                                                                WhatsApp

                                                            </a>


                                                            {/* Email */}

                                                            {data.Email && (

                                                                <a
                                                                    href={`mailto:${data.Email}`}
                                                                    className="flex items-center justify-center gap-2 px-4 py-2 rounded-lg bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 hover:bg-cyan-500/20 text-xs font-bold"
                                                                >

                                                                    <div className="icon-mail w-4 h-4"></div>

                                                                    Email

                                                                </a>

                                                            )}


                                                            {/* Delete */}

                                                            <button
                                                                onClick={() =>
                                                                    handleDeleteInquiry(
                                                                        inquiry.objectId
                                                                    )
                                                                }
                                                                className="flex items-center justify-center gap-2 px-4 py-2 rounded-lg bg-white/5 text-gray-400 border border-white/5 hover:bg-red-500/20 hover:text-red-400 transition-colors text-xs font-bold"
                                                            >

                                                                <div className="icon-trash-2 w-4 h-4"></div>

                                                                Delete

                                                            </button>

                                                        </div>

                                                    </div>

                                                </div>

                                            );

                                        })}

                                    </div>

                                )}

                            </div>

                        )}

                    </div>

                </div>

            );

        }


        // ============================================================
        // START REACT APPLICATION
        // ============================================================

        const root =
            ReactDOM.createRoot(
                document.getElementById('root')
            );


        root.render(
            <React.StrictMode>
                <AdminApp />
            </React.StrictMode>
        );

    </script>

</body>
</html>
