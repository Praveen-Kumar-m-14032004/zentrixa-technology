    <!--
    ============================================================
      API BRIDGE — replaces trickle SDK with your Express server
      All components call trickleCreateObject / trickleListObjects
      etc. exactly as before; these functions now hit /api/*
    ============================================================
    -->
    <script>
        // ── Base URL: change to your deployed domain in production ──
        //const API_BASE = 'http://localhost:3000';
        const API_BASE = window.location.origin;

        /**
         * POST /api/objects/:type
         * Creates a new record and returns { objectId, objectData }
         */
        async function trickleCreateObject(type, data) {
            const res = await fetch(`${API_BASE}/api/objects/${type}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || `Failed to create ${type}`);
            }
            return res.json();   // { objectId, objectData }
        }

        /**
         * GET /api/objects/:type?limit=100&desc=true
         * Returns { items: [{ objectId, objectData }, ...] }
         */
        async function trickleListObjects(type, limit = 100, desc = true) {
            const res = await fetch(
                `${API_BASE}/api/objects/${type}?limit=${limit}&desc=${desc}`
            );
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || `Failed to fetch ${type}`);
            }
            return res.json();   // { items: [...] }
        }

        /**
         * PUT /api/objects/:type/:id
         * Updates an existing record; returns { objectId, objectData }
         */
        async function trickleUpdateObject(type, id, data) {
            const res = await fetch(`${API_BASE}/api/objects/${type}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || `Failed to update ${type}/${id}`);
            }
            return res.json();
        }

        /**
         * DELETE /api/objects/:type/:id
         * Deletes a record; returns { success: true }
         */
        async function trickleDeleteObject(type, id) {
            const res = await fetch(`${API_BASE}/api/objects/${type}/${id}`, {
                method: 'DELETE'
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || `Failed to delete ${type}/${id}`);
            }
            return res.json();
        }
    </script>
